name: 每日新闻早报

on:
  schedule:
    # 北京时间早上 7:00 = UTC 23:00
    - cron: '0 23 * * *'
  workflow_dispatch:  # 允许手动触发测试

jobs:
  send-news:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行新闻早报
        run: python send_news.py
